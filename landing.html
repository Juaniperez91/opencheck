<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OpenCheck — Acceso por invitación</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --b:#1A6FA8;--bm:#2A8FCC;--bl:#E6F4FB;--bd:#0C4A72;--bb:#9FD4EE;
  --t:#1A1917;--t2:#6B6963;--t3:#9A9891;
  --s:#fff;--s2:#F5F8FB;--s3:#E2EBF2;
}
body{font-family:'Sora',sans-serif;color:var(--t);background:linear-gradient(135deg,#0C4A72 0%,#1A6FA8 100%);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:var(--s);border-radius:20px;padding:48px 40px;max-width:440px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,0.2);text-align:center}
.logo{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:32px}
.logo-icon{width:42px;height:42px;background:var(--b);border-radius:11px;display:flex;align-items:center;justify-content:center}
.logo-icon svg{fill:white;width:22px;height:22px}
.logo-text{font-size:22px;font-weight:700;color:var(--t);letter-spacing:-0.5px}
.logo-text span{color:var(--b)}
.logo-text sup{font-size:11px;font-weight:500;color:var(--t3);margin-left:2px}
h1{font-size:22px;font-weight:600;letter-spacing:-0.5px;margin-bottom:10px;color:var(--t)}
.sub{font-size:14px;color:var(--t2);line-height:1.6;margin-bottom:28px}
.input{width:100%;padding:14px 16px;border:1.5px solid var(--s3);border-radius:10px;font-family:'DM Mono',monospace;font-size:15px;letter-spacing:1px;text-align:center;text-transform:uppercase;outline:none;transition:border-color .2s;margin-bottom:14px}
.input:focus{border-color:var(--b)}
.input::placeholder{color:var(--t3);text-transform:none;letter-spacing:0}
.btn{width:100%;padding:14px;background:var(--b);color:white;border:none;border-radius:10px;font-family:'Sora',sans-serif;font-size:15px;font-weight:600;cursor:pointer;transition:all .2s}
.btn:hover{background:var(--bd);transform:translateY(-1px)}
.btn:disabled{opacity:0.6;cursor:not-allowed;transform:none}
.error{background:#FEF2F2;border:1px solid #FECACA;color:#991B1B;padding:10px 14px;border-radius:8px;font-size:13px;margin-bottom:14px;display:none}
.error.show{display:block}
.foot{margin-top:32px;padding-top:24px;border-top:1px solid var(--s3);font-size:12px;color:var(--t3)}
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <div class="logo-icon">
      <svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
    </div>
    <span class="logo-text">Open<span>Check</span><sup>™</sup></span>
  </div>
  <h1>Plataforma privada</h1>
  <p class="sub">El acceso a OpenCheck es por invitación. Ingresá tu código para continuar.</p>
  <div id="err" class="error"></div>
  <input type="text" id="codigo" class="input" placeholder="Código de invitación" maxlength="20" autocomplete="off">
  <button class="btn" id="btn" onclick="validar()">Acceder</button>
  <div class="foot">© 2026 OpenCheck™ · Marca en proceso de registro ante INPI</div>
</div>
<script>
var SUPABASE_URL = 'https://dnaxspzhfeojhbelzvlb.supabase.co';
var SUPABASE_KEY = 'sb_publishable_nxUiADqiWOuxdQvHECTzkQ_2u6Abj1J';
async function validar(){
  var btn = document.getElementById('btn');
  var err = document.getElementById('err');
  var inp = document.getElementById('codigo');
  var codigo = inp.value.trim().toUpperCase();
  err.classList.remove('show');
  if(!codigo){ err.textContent='Ingresá tu código de invitación.'; err.classList.add('show'); return; }
  btn.disabled=true; btn.textContent='Verificando...';
  try {
    var r = await fetch(SUPABASE_URL + '/rest/v1/invitaciones?codigo=eq.' + encodeURIComponent(codigo) + '&activo=eq.true', {
      headers: {'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY}
    });
    var data = await r.json();
    if(!data || data.length === 0){
      err.textContent='Código inválido o desactivado.';
      err.classList.add('show');
      btn.disabled=false; btn.textContent='Acceder';
      return;
    }
    var inv = data[0];
    var nuevoAcceso = (inv.accesos||0) + 1;
    var ahora = new Date().toISOString();
    var update = {accesos: nuevoAcceso, ultimo_acceso: ahora};
    if(!inv.primer_acceso) update.primer_acceso = ahora;
    await fetch(SUPABASE_URL + '/rest/v1/invitaciones?id=eq.' + inv.id, {
      method: 'PATCH',
      headers: {'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY, 'Content-Type': 'application/json'},
      body: JSON.stringify(update)
    });
    sessionStorage.setItem('oc_invite', codigo);
    sessionStorage.setItem('oc_invite_name', inv.nombre_invitado || '');
    window.location.href = '/site';
  } catch(e) {
    err.textContent='Error al validar. Intentá de nuevo.';
    err.classList.add('show');
    btn.disabled=false; btn.textContent='Acceder';
  }
}
document.getElementById('codigo').addEventListener('keypress', function(e){
  if(e.key === 'Enter') validar();
});
</script>
</body>
</html>
